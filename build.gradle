plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        // Hosts Cloth Config, which backs the client config screen.
        name = "Architectury"
        url = "https://maven.architectury.dev/"
    }
    maven {
        // Hosts Legendary Survival Overhaul, which isn't mirrored on ModMaven.
        // See integration/lso/LSOIntegration.java.
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = 'GitHubPackages'
        url = 'https://maven.pkg.github.com/kgbcupcake/MariesLib'
        credentials {
            username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
            password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
        }
    }
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', ''
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation "dev.marie.MariesLib:marieslib:${maries_lib_version}"
    if (!gradle.ext.localMariesFrameworkPresent) {
        additionalRuntimeClasspath "dev.marie.MariesLib:marieslib:${maries_lib_version}"
    }

    // Cloth Config backs the client config screen (see client/config/).
    // Not exposed transitively by marieslib (implementation-scoped there), so
    // Thermal Systems needs its own copy, same as Nourished.
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"

    // Compile-time only: PNC:R integration must remain optional at runtime.
    // See integration/pneumaticcraft/PneumaticCraftIntegration.java.
    compileOnly "me.desht.pneumaticcraft:pneumaticcraft-repressurized:${pneumaticcraft_version}"

    // Compile-time only: Mekanism integration must remain optional at runtime.
    // See integration/mekanism/MekanismIntegration.java.
    compileOnly "mekanism:Mekanism:${mekanism_version}:api"

    // Compile-time only: LSO integration must remain optional at runtime.
    // See integration/lso/LSOIntegration.java.
    compileOnly "maven.modrinth:legendary-survival-overhaul:${lso_version}"

    // Test-scoped only, mirroring the dependencies above: capability-registration
    // tests use stub implementations of the target mods' public API interfaces, which
    // requires these interfaces on the test runtime classpath too (unlike the compileOnly
    // dependencies above, this does not affect the shipped mod jar's optional-at-runtime
    // guarantee - it only affects how this test source set itself is run).
    testImplementation "me.desht.pneumaticcraft:pneumaticcraft-repressurized:${pneumaticcraft_version}"
    testImplementation "mekanism:Mekanism:${mekanism_version}:api"
    testImplementation "maven.modrinth:legendary-survival-overhaul:${lso_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        pneumaticcraft_version_range: pneumaticcraft_version_range,
        mekanism_version_range : mekanism_version_range,
        enderio_version_range  : enderio_version_range,
        lso_version_range      : lso_version_range,
        maries_framework_version_range: maries_framework_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

// MarieLib root is an aggregator (no :classes); shadowJar must finish before compile.
if (gradle.ext.localMariesFrameworkPresent) {
    def mariesFrameworkIncluded = gradle.includedBuilds.find { it.name == 'MarieLib' }
    if (mariesFrameworkIncluded != null) {
        tasks.named('compileJava').configure {
            dependsOn mariesFrameworkIncluded.task(':shadowJar')
        }
        tasks.named('compileTestJava').configure {
            dependsOn mariesFrameworkIncluded.task(':shadowJar')
        }
    }
}
